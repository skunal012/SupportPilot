# nginx serves the built React app and reverse-proxies the API paths to the
# backend container. This is the production equivalent of the Vite dev proxy in
# vite.config.js: the browser only ever talks to this one origin, so there's no
# CORS and the frontend code (which calls /chat, /ingest, /search) is unchanged.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve the file if it exists, otherwise fall back to index.html so
    # client-side routing / refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: forward to the backend service (compose DNS name "backend", port 8080).
    location ~ ^/(chat|ingest|search) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # /chat streams answers token-by-token over SSE. Buffering would hold the
        # whole response back and break the live streaming, so turn it off and
        # allow a long-lived connection.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
